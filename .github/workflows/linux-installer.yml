name: Linux install tool

# The install helper (tools/installer) on Linux: its tests, then the native
# HaloCEVitaInstaller built by PyInstaller with ffmpeg inside, checked by its
# selftest and uploaded as an artifact. Only runs when the tool changes.
on:
  push:
    paths:
      - "tools/installer/**"
      - ".github/workflows/linux-installer.yml"
  workflow_dispatch:

concurrency:
  group: linux-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # the distribution's Python, so the _tkinter extension and the Tk
      # libraries come from the same python3-tk package (the toolcache
      # Python from setup-python does not ship tkinter on Linux)
      - name: Install tkinter, ffmpeg and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv ffmpeg xvfb

      - name: Install the build and test tools
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r tools/installer/requirements-build.txt -r tools/installer/requirements-dev.txt

      - name: Tests
        run: xvfb-run -a .venv/bin/python -m pytest -q tools/installer/tests

      - name: Build HaloCEVitaInstaller
        run: .venv/bin/python tools/installer/build_linux.py

      - name: Self test of the built program
        run: |
          chmod +x tools/installer/dist/HaloCEVitaInstaller
          tools/installer/dist/HaloCEVitaInstaller selftest --report selftest.txt
          cat selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HaloCEVitaInstaller-linux
          path: tools/installer/dist/HaloCEVitaInstaller
          retention-days: 14
